# Real environment variables win over .env, so the containers always use MySQL.
x-app-env: &app-env
  APP_ENV: local # any other value forces HTTPS
  APP_DEBUG: "true"
  APP_URL: http://localhost:${APP_PORT:-8080}
  DB_CONNECTION: mysql
  DB_HOST: mysql-db
  DB_PORT: "3306"
  DB_DATABASE: laravel
  DB_USERNAME: laravel
  DB_PASSWORD: laravel
  MAIL_MAILER: log

services:
  app:
    build:
      context: .
      target: app
    environment: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 3s
      timeout: 2s
      retries: 100

  nginx:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  mysql-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: laravel
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ularavel", "-plaravel"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  db_data:
  storage:
